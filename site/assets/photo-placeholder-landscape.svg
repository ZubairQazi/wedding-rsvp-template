<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">Landscape photo placeholder</title>
  <desc id="desc">Replace this file with a landscape photo.</desc>
  <rect width="1200" height="900" fill="#ddd0b8"/>
  <rect x="55" y="55" width="1090" height="790" rx="18" fill="#f7f0e3" stroke="#aa8f69" stroke-width="6" stroke-dasharray="20 16"/>
  <text x="600" y="430" text-anchor="middle" fill="#715b43" font-family="Arial, sans-serif" font-size="42">Replace with your photo</text>
  <text x="600" y="490" text-anchor="middle" fill="#8a765e" font-family="Arial, sans-serif" font-size="26">1200 × 900 recommended</text>
</svg>
